name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # MSRV 1.70 — minimum supported Rust version for this workspace
      - name: Install Rust stable (MSRV 1.70)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.70"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target/
          key: ${{ runner.os }}-cargo-target-1.70-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-1.70-

      - name: Install cargo-make
        run: cargo install cargo-make --locked

      # Format check (read-only; fails if code is not already formatted)
      - name: Format check
        run: cargo make fmt

      # Compile all targets in the workspace
      - name: Workspace check
        run: cargo make check

      # Clippy with -D warnings — zero lint warnings permitted
      - name: Clippy (-D warnings)
        run: cargo make clippy

      # Unit and integration tests across the workspace
      - name: Test (workspace)
        run: cargo make test

      # Verify no_std core compiles for wasm32-unknown-unknown
      - name: wasm32 build check
        run: cargo make wasm-check

      # C-ABI portability proof: build the staticlib and verify exported symbols
      - name: C-ABI portability proof
        run: |
          cargo build --package wasm4games-capi --release
          nm target/release/libwasm4games_capi.a | grep -E ' T ' | head -20
          echo "C-ABI symbols exported successfully"
