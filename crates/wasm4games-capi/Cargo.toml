[package]
name = "wasm4games-capi"
version = "26.6.13"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/wasm4games"
description = "C ABI staticlib surface over wasm4games kernels — the cross-language portability proof"
readme = "README.md"
publish = false

[lib]
# - `lib`: in-workspace rlib (unit tests below use it).
# - `staticlib`: the executed C portability proof (portability_proof.sh) links this archive.
# - `cdylib`: emits `wasm4games_capi.wasm` for the wasm32 target so
#   `scripts/wasm32_verify.sh` can EXECUTE the corpus-digest proof under a wasm runtime
#   (wasmtime) instead of verifying the wasm32 leg at build level only.
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
# Offline-pure: only the no_std wasm4games core (no git/network deps), so this is safe
# as a workspace member and builds in CI. Contrast with wasm4games-wasm4pm (excluded:
# it pulls the external wasm4pm git repos).
wasm4games = { path = "../wasm4games" }
